name: Release

# Builds one version's installers, attaches them to its draft release, and
# publishes it. release-please.yml calls it when a release pull request is
# merged; running it by hand rebuilds a draft (docs/releasing.md).
#
# Every job builds the same frozen commit, and the release is checked against it
# before the first build and again right before publishing: a tag or a draft
# that moved in between would otherwise publish installers built from a commit
# the release does not name.
on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag, such as v0.1.0"
        required: true
        type: string
      ref:
        description: "Full SHA of the commit to build"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, such as v0.1.0"
        required: true

# Nothing by default: each job names what it needs.
permissions: {}

# One run per tag. A queued run waits rather than cancelling one that may be
# uploading.
concurrency:
  group: candeo-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || inputs.tag }}
          persist-credentials: false

      - name: Freeze the commit and check every version
        id: resolve
        env:
          TAG: ${{ inputs.tag }}
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          # Numbers only: the MSI refuses a pre-release version, and would fail
          # only at packaging, after the draft was touched.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The tag must look like v1.2.3, got $TAG"
            exit 1
          fi
          SHA="$(git rev-parse HEAD)"
          # A tag object has the shape of a SHA too, and checkout peels it:
          # equality is what proves the commit asked for is the one built.
          if [ -n "$REQUESTED_REF" ] && [ "$SHA" != "$REQUESTED_REF" ]; then
            echo "::error::ref must be the full SHA of a commit: $REQUESTED_REF checked out as $SHA"
            exit 1
          fi

          lock_version() {
            grep -A1 -x "name = \"$1\"" Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p'
          }
          {
            echo "package.json $(jq -r .version package.json)"
            echo "apps/desktop/package.json $(jq -r .version apps/desktop/package.json)"
            echo "packages/effects-api/package.json $(jq -r .version packages/effects-api/package.json)"
            echo "tauri.conf.json $(jq -r .version apps/desktop/src-tauri/tauri.conf.json)"
            echo "Cargo.toml $(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)"
            # Updated by a JSONPath that depends on how release-please parses
            # TOML: checked here rather than trusted.
            for crate in candeo-desktop candeo-device candeo-protocol; do
              echo "Cargo.lock:$crate $(lock_version "$crate")"
            done
          } > "$RUNNER_TEMP/versions"
          cat "$RUNNER_TEMP/versions"
          if awk -v v="$VERSION" '$2 != v { bad = 1 } END { exit !bad }' "$RUNNER_TEMP/versions"; then
            echo "::error::Every version file must say $VERSION"
            exit 1
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create or reuse the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          # The remote tag, peeled when annotated.
          REMOTE="$(git ls-remote "https://github.com/$GH_REPO.git" "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          TAG_SHA="$(printf '%s\n' "$REMOTE" | awk '/\^\{\}$/ { print $1 }')"
          [ -n "$TAG_SHA" ] || TAG_SHA="$(printf '%s\n' "$REMOTE" | awk 'NR == 1 { print $1 }')"
          if [ -n "$TAG_SHA" ] && [ "$TAG_SHA" != "$SHA" ]; then
            echo "::error::Tag $TAG points at $TAG_SHA, not at the $SHA this run builds"
            exit 1
          fi

          RELEASES="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" | jq -s 'add // []')"
          PUBLISHED="$(jq -r --arg tag "$TAG" '[.[] | select(.tag_name == $tag and (.draft | not)) | .id][0] // empty' <<< "$RELEASES")"
          if [ -n "$PUBLISHED" ]; then
            # Uploads replace one asset at a time: rebuilding a public release
            # would show a mix of old and new installers while it runs.
            echo "::error::Release $TAG is already published. Release a new version, or turn it back into a draft first (docs/releasing.md)."
            exit 1
          fi

          DRAFTS="$(jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag and .draft) | .id' <<< "$RELEASES")"
          KEEP=""
          for id in $DRAFTS; do
            if [ -z "$KEEP" ]; then
              KEEP="$id"
            else
              echo "Deleting duplicate draft $id"
              gh api -X DELETE "repos/$GH_REPO/releases/$id"
            fi
          done

          if [ -z "$KEEP" ]; then
            gh release create "$TAG" --draft --title "$TAG" --target "$SHA" --generate-notes
            exit 0
          fi

          # Without a tag, the draft's target is the only link to the commit.
          TARGET="$(jq -r --arg id "$KEEP" '.[] | select((.id | tostring) == $id) | .target_commitish' <<< "$RELEASES")"
          if [ -z "$TAG_SHA" ] && [ "$TARGET" != "$SHA" ]; then
            echo "::error::Draft $TAG targets $TARGET, not the $SHA this run builds"
            exit 1
          fi
          echo "Reusing draft $KEEP"
          # Every asset already there came from an earlier run: none survives.
          # Listed in its own assignment, so a failing listing stops the job
          # instead of reading as "nothing to delete".
          ASSETS="$(gh api --paginate "repos/$GH_REPO/releases/$KEEP/assets?per_page=100" --jq '.[] | "\(.id) \(.name)"')"
          while read -r asset name; do
            [ -n "$asset" ] || continue
            echo "Deleting $name, left by an earlier run"
            gh api -X DELETE "repos/$GH_REPO/releases/assets/$asset"
          done <<< "$ASSETS"

  windows:
    needs: prepare
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      # No cache in this workflow: a release is rare, and what ships is built
      # from nothing another run could have left behind.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @candeo/desktop exec tauri build --bundles nsis,msi
      - name: Attach the installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          built=(
            "target/release/bundle/nsis/Candeo_${VERSION}_x64-setup.exe"
            "target/release/bundle/msi/Candeo_${VERSION}_x64_en-US.msi"
          )
          # Tauri names installers after productName; release files keep the
          # lowercase name. Copied to a folder of their own: renamed in place,
          # the name differs only by case, the same file on Windows.
          mkdir -p assets
          files=()
          for f in "${built[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::$f was not built"
              find target/release/bundle -maxdepth 2 -type f
              exit 1
            fi
            files+=("assets/candeo${f##*/Candeo}")
            cp "$f" "${files[-1]}"
          done
          gh release upload "$TAG" --clobber "${files[@]}"

  linux:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      # Same list as the CI `linux` job; `rpm` reads the package back below.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            libudev-dev build-essential pkg-config file rpm
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24 }
      - run: pnpm install --frozen-lockfile
      # No AppImage: it cannot install the udev rule, and without it the
      # keyboard is unreachable.
      - run: pnpm --filter @candeo/desktop exec tauri build --bundles deb,rpm
      - name: Check the udev rule and attach the packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          deb="target/release/bundle/deb/Candeo_${VERSION}_amd64.deb"
          rpm="target/release/bundle/rpm/Candeo-${VERSION}-1.x86_64.rpm"
          for f in "$deb" "$rpm"; do
            if [ ! -f "$f" ]; then
              echo "::error::$f was not built"
              find target/release/bundle -maxdepth 2 -type f
              exit 1
            fi
          done
          rule='usr/lib/udev/rules.d/60-candeo.rules'
          dpkg-deb -c "$deb" | grep -F "$rule"
          rpm -qpl "$rpm" | grep -F "/$rule"
          # Lowercase release files, as for the Windows installers.
          mkdir -p assets
          cp "$deb" "assets/candeo_${VERSION}_amd64.deb"
          cp "$rpm" "assets/candeo-${VERSION}-1.x86_64.rpm"
          gh release upload "$TAG" --clobber "assets/candeo_${VERSION}_amd64.deb" "assets/candeo-${VERSION}-1.x86_64.rpm"

  publish:
    needs: [prepare, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checksums, last checks, publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          expected=(
            "candeo_${VERSION}_x64-setup.exe"
            "candeo_${VERSION}_x64_en-US.msi"
            "candeo_${VERSION}_amd64.deb"
            "candeo-${VERSION}-1.x86_64.rpm"
          )
          mkdir -p installers
          cd installers
          for name in "${expected[@]}"; do
            gh release download "$TAG" --pattern "$name" --dir .
            [ -f "$name" ] || { echo "::error::$name is missing from the release"; exit 1; }
          done
          sha256sum "${expected[@]}" > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" --clobber SHA256SUMS

          # Exactly these assets: anything else was not built by this run.
          attached="$(gh release view "$TAG" --json assets --jq '[.assets[].name] | sort | join(" ")')"
          wanted="$(printf '%s\n' "${expected[@]}" SHA256SUMS | sort | paste -sd ' ')"
          if [ "$attached" != "$wanted" ]; then
            echo "::error::Release $TAG holds [$attached], expected [$wanted]"
            exit 1
          fi

          # Checked again at the last moment: the builds took long enough for
          # the tag or the draft to move.
          REMOTE="$(git ls-remote "https://github.com/$GH_REPO.git" "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          TAG_SHA="$(printf '%s\n' "$REMOTE" | awk '/\^\{\}$/ { print $1 }')"
          [ -n "$TAG_SHA" ] || TAG_SHA="$(printf '%s\n' "$REMOTE" | awk 'NR == 1 { print $1 }')"
          if [ -n "$TAG_SHA" ]; then
            if [ "$TAG_SHA" != "$SHA" ]; then
              echo "::error::Tag $TAG now points at $TAG_SHA, not at the $SHA this run built"
              exit 1
            fi
          else
            TARGET="$(gh release view "$TAG" --json targetCommitish --jq .targetCommitish)"
            if [ "$TARGET" != "$SHA" ]; then
              echo "::error::Release $TAG targets $TARGET, not the $SHA this run built"
              exit 1
            fi
          fi

          gh release edit "$TAG" --draft=false
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "false" ]; then
            echo "::error::Release $TAG is still a draft"
            exit 1
          fi
          echo "Published $TAG"
