[package]
name = "candeo-desktop"
description = "Candeo desktop application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# Le suffixe `_lib` evite un conflit de nom avec le binaire sous Windows.
name = "candeo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
candeo-protocol.workspace = true
candeo-device.workspace = true
hidapi.workspace = true
serde.workspace = true
# `tray-icon` : l'icône de zone de notification — voir `src/tray.rs`. Ce n'est
# pas un agrément d'interface, c'est ce qui rend vraie la promesse « un effet
# tourne fenêtre fermée » : sans quelque chose qui survive à la dernière fenêtre,
# la fermer arrête le processus, donc les fils de rendu.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde_json = "1"

# Une seule instance à la fois — voir `src/single_instance.rs`. Sans la
# fonctionnalité `semver`, qui laisserait cohabiter deux versions incompatibles :
# ce qui ne se partage pas ici, c'est le clavier et `settings.json`, et ni l'un
# ni l'autre ne s'entend mieux avec un voisin d'une autre version.
tauri-plugin-single-instance = "2"

# The system notification saying that closing hid the window (`src/tray.rs`).
tauri-plugin-notification = "2"

# Moteur d'effets. `loader` sert à résoudre `@candeo/effects-api` vers un
# module interne, sans bundler ni `node_modules`.
rquickjs = { version = "0.13", features = ["loader"] }

# Journal — voir `src/journal.rs`. `tracing` plutôt que `tauri-plugin-log`, qui
# est première partie et réglerait l'essentiel en quelques lignes : il y a une
# boucle de rendu par appareil, et « écriture refusée » ne sert à rien sans
# savoir laquelle. Un *span* par boucle attache l'appareil et l'effet à tout ce
# qui s'y journalise, sans trimballer un identifiant dans chaque appel.
#
# Ici seulement, et pas dans l'espace de travail : `candeo-protocol` et
# `candeo-device` n'ont aucune dépendance, et c'est ce qui rend leurs tests
# exécutables sans rien installer. Le jour où l'une d'elles voudrait journaliser,
# `tracing` monterait dans `[workspace.dependencies]`.
tracing = "0.1"
# `env-filter` porte la directive et son analyse, `fmt` la mise en forme.
# La recharge à chaud (`reload`) est dans le tronc, sans fonctionnalité à armer.
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Rotation quotidienne et nombre de fichiers plafonné : une application
# d'éclairage tourne des jours.
tracing-appender = "0.2"
# Content hash of an effect's source, pairing it with its compiled cache.
# Already in the tree through Tauri.
sha2 = "0.10"

# Key names in the active keyboard layout (`GetKeyNameTextW`, `src/keys.rs`), key
# presses through Raw Input (`src/runtime/presses.rs`) and the display language
# (`src/language.rs`). Already in the tree through Tauri.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  # Devices plugged in and unplugged (`src/hotplug.rs`).
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_HumanInterfaceDevice",
  "Win32_Foundation",
  "Win32_Globalization",
  # The Windows build in the copied diagnostic (`src/journal.rs`).
  "Win32_System_Registry",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

# Kernel uevents for devices plugged in and unplugged (`src/hotplug.rs`). Already
# in the tree.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
# Le stockage se teste dans un dossier temporaire, jamais dans celui de
# l'utilisateur — et sans lancer Tauri.
tempfile = "3"
